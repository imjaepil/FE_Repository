<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>플로깅 시작 - 설정 및 목표 설정</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
      background: #f7f8fa;
      min-width: 360px;
      max-width: 430px;
      margin-left: auto;
      margin-right: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: #1a232b;
      position: relative;
      overflow-x: hidden;
    }
    .header {
      padding: 32px 24px 16px 24px;
      font-size: 24px;
      font-weight: 700;
      border-bottom: 2px solid #e5e7eb;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .back-btn {
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 8px;
      transition: background-color 0.2s;
      flex-shrink: 0;
    }
    .back-btn:hover {
      background: #eee;
    }
    .back-btn svg {
      width: 20px;
      height: 20px;
      stroke: #222;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }    
    .tabs {
      display: flex;
      padding: 0 24px 16px 24px;
      font-size: 18px;
      color: #999;
      gap: 30px;
      user-select: none;
      position: relative;
      z-index: 10;
    }
    .tabs button {
      background: none;
      border: none;
      font-size: 18px;
      color: #999;
      gap: 30px;
      user-select: none;
      cursor: pointer;
      padding: 0;
      margin: 0;
      font-family: inherit;
    }
    .tabs button.active {
      color: #000;
      font-weight: 700;
      border-bottom: 2px solid #000;
      padding-bottom: 6px;
}
    .alert-card {
      display: flex;
      align-items: center;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 3px 15px rgba(20,30,60,0.08);
      margin: 0 24px 16px 24px;
      padding: 16px 20px;
      gap: 15px;
      user-select: none;
      position: relative;
      z-index: 10;
    }
    .alert-icon {
      font-size: 32px;
      color: #555;
    }
    .alert-body {
      font-size: 16px;
      font-weight: 700;
      color: #222;
    }
    .alert-sub {
      font-size: 14px;
      color: #909090;
      font-weight: 400;
      margin-top: 3px;
    }
    .map-area {
      position: relative;
      margin: 0 24px;
      height: 270px;
      border-radius: 22px;
      user-select: none;
      z-index: 5;
      background: transparent;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    .map-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 22px;
      user-select: none;
      pointer-events: none;
    }
    .main-btn-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      margin: 30px 24px 10px 24px;
      position: relative;
      z-index: 10;
      user-select: none;
    }
    button.main-round-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f59e00, #fca311);
      color: white;
      font-size: 38px;
      font-weight: 800;
      border: none;
      box-shadow: 0 10px 28px rgba(246,155,0,0.45);
      cursor: pointer;
      transition: background 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    button.main-round-btn:hover {
      background: linear-gradient(135deg, #fca311, #f59e00);
    }
    button.main-round-btn:active {
      background: #d87d00;
      box-shadow: 0 6px 16px rgba(216,124,0,0.7);
    }
    button.icon-btn {
      background: #fff;
      border-radius: 50%;
      width: 54px;
      height: 54px;
      box-shadow: 0 3px 14px rgba(20,30,60,0.05);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #444;
      transition: background 0.25s;
      position: relative;
    }
    button.icon-btn:hover {
      background: #f0f0f0;
    }
    button.icon-btn.muted::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 12%;
      width: 38px;
      height: 5px;
      background-color: currentColor;
      transform: translateY(-50%) rotate(45deg);
      pointer-events: none;
      border-radius: 2px;
    }
    .btn-under-label {
      font-size: 18px;
      color: #222;
      font-weight: 600;
      text-align: center;
      margin: 8px 0 20px 0;
      user-select: none;
    }
    .goal-btn {
      width: 160px;
      margin: 0 auto 40px auto;
      font-size: 15px;
      border-radius: 15px;
      font-weight: 600;
      border: none;
      padding: 12px 0;
      cursor: pointer;
      background: #eee;
      color: #444;
      box-shadow: inset 0 1px 3px rgb(255 255 255 / 0.3);
      user-select: none;
      transition: background 0.3s;
      text-align: center;
      display: block;
    }
    .goal-btn:hover {
      background: #ddd;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      max-width: none;
      width: 430px;
      background: #fff;
      border-top: 1.5px solid #e5e7eb;
      height: 53px;
      z-index: 99;
      display: flex;
      user-select:none;
    }
    .nav-item {
      flex: 1;
      text-align: center;
      font-size: 16px;
      padding-top: 6px;
      color: #000;
      letter-spacing: -1px;
      cursor: pointer;
      text-decoration: none;
      line-height: 53px;
      transition: background 0.2s, color 0.2s;
      box-sizing: border-box;
      user-select: none;
    }
    .nav-item.active {
      color: #000;
      font-weight: 700;
      background: #eef2f7;
    }

    /* Modal base styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      overflow-y: auto;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal {
      background: white;
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      padding: 24px 28px 32px 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
      font-size: 15px;
    }
    .modal-header {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-close {
      border: none;
      background: none;
      font-size: 30px;
      font-weight: 700;
      cursor: pointer;
      color: #999;
      transition: color 0.3s;
      line-height: 1;
    }
    .modal-close:hover {
      color: #555;
    }

    /* Form groups and layout */
    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
    }
    label {
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
      user-select: none;
    }
    input[type="text"],
    input[type="number"],
    input[type="date"],
    select,
    textarea {
      padding: 12px 14px;
      font-size: 15px;
      border: 1.5px solid #ccc;
      border-radius: 12px;
      outline-offset: 2px;
      transition: border-color 0.3s;
      resize: vertical;
      font-family: inherit;
      box-sizing: border-box;
    }
    input[type="text"]:focus,
    input[type="number"]:focus,
    input[type="date"]:focus,
    select:focus,
    textarea:focus {
      border-color: #f59e00;
      box-shadow: 0 0 6px #f59e00aa;
    }
    textarea {
      min-height: 80px;
    }
    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .form-row > * {
      flex: 1 1 45%;
      min-width: 140px;
    }
    .form-actions {
      margin-top: 28px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.3s;
      user-select: none;
      font-size: 15px;
      min-width: 100px;
      text-align: center;
    }
    .btn-primary {
      background: #f59e00;
      color: white;
    }
    .btn-primary:hover {
      background: #d87d00;
    }
    .btn-secondary {
      background: #eee;
      color: #444;
    }
    .btn-secondary:hover {
      background: #ddd;
    }
    /* Scrollbar style (Webkit browsers) */
    .modal::-webkit-scrollbar {
      width: 8px;
    }
    .modal::-webkit-scrollbar-thumb {
      background-color: #c2c2c2;
      border-radius: 4px;
    }
    .modal::-webkit-scrollbar-track {
      background-color: #f7f7f7;
    }
  </style>
</head>
<body>
<div class="top-bar" style="display: flex; align-items: center; gap: 10px;">
  <div class="back-btn" onclick="history.back()" title="뒤로가기">
    <svg viewBox="0 0 24 24" aria-hidden="true" >
      <polyline points="15 18 9 12 15 6" />
    </svg>
  </div>
  <div class="top-title" style="font-size: 24px; font-weight: 700; user-select: none;">러닝</div>
</div>

  <nav class="tabs" role="tablist">
  <button class="active" role="tab" aria-selected="true" onclick="location.href='plogging_start.html'">바로 시작</button>
  <button role="tab" aria-selected="false" onclick="location.href='guide.html'">러닝 가이드</button>
</nav>

  <section class="alert-card" role="alert" aria-live="polite">
    <span class="alert-icon" aria-hidden="true">🌙</span>
    <div>
      <p class="alert-body">밤에 러닝하시나요?</p>
      <p class="alert-sub">안전을 위해 조명을 지참하세요.</p>
    </div>
  </section>

  <div class="map-area" aria-label="러닝 지도 영역" role="region">
    <img src="./imgs/img3.jpg" alt="지도 이미지" style="width:100%; height:100%; object-fit:cover; border-radius:22px;" />
  </div>

  <div class="main-btn-area">
    <button class="icon-btn" aria-label="설정 버튼" title="설정" id="settingsBtn">
      ⚙️
    </button>

    <button class="main-round-btn" id="startBtn" aria-label="러닝 시작 버튼">시작</button>

    <button class="icon-btn" id="musicBtn" aria-label="음악 버튼" title="음악">
      🎵
    </button>
  </div>

  <button class="goal-btn" id="goalBtn" aria-label="목표 설정 버튼">목표 설정</button>

  <nav class="bottom-nav" role="navigation" aria-label="하단 내비게이션 바">
  <a class="nav-item active" href="index.html" tabindex="0" aria-current="page">홈</a>
  <a class="nav-item" href="stats.html" tabindex="0">통계</a>
  <a class="nav-item" href="chat.html" tabindex="0">채팅</a>
  <a class="nav-item" href="settings.html" tabindex="0">설정</a>
</nav>

  <!-- 목표설정 모달 -->
  <div class="modal-overlay" id="goalModal" role="dialog" aria-modal="true" aria-labelledby="goalModalTitle">
    <div class="modal" role="document">
      <div class="modal-header">
        <h2 id="goalModalTitle">목표 설정</h2>
        <button class="modal-close" aria-label="모달 닫기" id="goalCloseBtn">&times;</button>
      </div>
      <form id="goalForm" novalidate>
        <div class="form-group">
          <label for="goalDistance">목표 거리 (km)</label>
          <input type="number" id="goalDistance" name="goalDistance" min="0.1" step="0.1" placeholder="예: 5.0" required />
        </div>
        <div class="form-group">
          <label for="goalTrash">목표 쓰레기 양 (kg)</label>
          <input type="number" id="goalTrash" name="goalTrash" min="0" step="0.1" placeholder="예: 2.5" required />
        </div>
        <div class="form-group">
          <label for="goalDate">목표 마감일</label>
          <input type="date" id="goalDate" name="goalDate" required />
        </div>
        <div class="form-group">
          <label for="goalNote">메모 (선택)</label>
          <textarea id="goalNote" name="goalNote" placeholder="목표에 대한 간단한 메모를 작성하세요."></textarea>
        </div>
        <div class="form-row">
          <div>
            <label for="goalType">목표 유형</label>
            <select id="goalType" name="goalType" required>
              <option value="">선택하세요</option>
              <option value="daily">일간 목표</option>
              <option value="weekly">주간 목표</option>
              <option value="monthly">월간 목표</option>
            </select>
          </div>
          <div>
            <label for="goalPriority">우선순위</label>
            <select id="goalPriority" name="goalPriority" required>
              <option value="">선택하세요</option>
              <option value="high">높음</option>
              <option value="medium">중간</option>
              <option value="low">낮음</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>운동 강도</label>
          <div style="display: flex; gap: 12px; user-select:none;">
            <label><input type="radio" name="intensity" value="low" required /> 낮음</label>
            <label><input type="radio" name="intensity" value="normal" /> 보통</label>
            <label><input type="radio" name="intensity" value="high" /> 높음</label>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="goalCancelBtn">취소</button>
          <button type="submit" class="btn btn-primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 설정 모달 -->
  <div class="modal-overlay" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
    <div class="modal" role="document">
      <div class="modal-header">
        <h2 id="settingsModalTitle">설정</h2>
        <button class="modal-close" aria-label="모달 닫기" id="settingsCloseBtn">&times;</button>
      </div>
      <form id="settingsForm" novalidate>
        <div class="form-group">
          <label for="notifications">알림 설정</label>
          <select id="notifications" name="notifications" required>
            <option value="">선택하세요</option>
            <option value="all">전체 알림 받기</option>
            <option value="important">중요한 알림만 받기</option>
            <option value="none">알림 받지 않기</option>
          </select>
        </div>

        <fieldset class="form-group">
          <legend>위치 정보 사용</legend>
          <label><input type="radio" name="location" value="always" required /> 항상 허용</label>
          <label><input type="radio" name="location" value="whileusing" /> 앱 사용 시 허용</label>
          <label><input type="radio" name="location" value="never" /> 허용 안 함</label>
        </fieldset>

        <div class="form-group">
          <label><input type="checkbox" id="soundOn" name="soundOn" checked /> 소리 켜기</label>
        </div>

        <div class="form-group">
          <label>언어 선택</label>
          <select id="language" name="language" required>
            <option value="ko">한국어</option>
            <option value="en">영어</option>
            <option value="jp">일본어</option>
            <option value="cn">중국어</option>
          </select>
        </div>

        <div class="form-group">
          <label>테마 선택</label>
          <select id="theme" name="theme" required>
            <option value="light">라이트 모드</option>
            <option value="dark">다크 모드</option>
            <option value="system">시스템 기본값</option>
          </select>
        </div>

        <div class="form-group">
          <label for="dataSync">데이터 동기화 빈도 (분)</label>
          <input type="number" id="dataSync" name="dataSync" min="1" max="1440" step="1" value="60" required />
        </div>

        <fieldset class="form-group">
          <legend>추가 기능 선택</legend>
          <label><input type="checkbox" name="features" value="autoPause" /> 자동 일시정지</label>
          <label><input type="checkbox" name="features" value="voiceFeedback" checked /> 음성 피드백</label>
          <label><input type="checkbox" name="features" value="heartRateMonitor" /> 심박수 모니터링</label>
        </fieldset>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="settingsCancelBtn">취소</button>
          <button type="submit" class="btn btn-primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 목표설정 모달 열기/닫기
    const goalBtn = document.getElementById('goalBtn');
    const goalModal = document.getElementById('goalModal');
    const goalCloseBtn = document.getElementById('goalCloseBtn');
    const goalCancelBtn = document.getElementById('goalCancelBtn');
    const goalForm = document.getElementById('goalForm');

    function openGoalModal() {
      goalModal.classList.add('active');
      goalForm.reset();
      goalForm.querySelector('input, select, textarea').focus();
    }

    function closeGoalModal() {
      goalModal.classList.remove('active');
    }

    goalBtn.addEventListener('click', openGoalModal);
    goalCloseBtn.addEventListener('click', closeGoalModal);
    goalCancelBtn.addEventListener('click', closeGoalModal);
    goalModal.addEventListener('click', (e) => {
      if (e.target === goalModal) closeGoalModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && goalModal.classList.contains('active')) {
        closeGoalModal();
      }
    });
    goalForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!goalForm.checkValidity()) {
        goalForm.reportValidity();
        return;
      }
      const data = {
        goalDistance: goalForm.goalDistance.value,
        goalTrash: goalForm.goalTrash.value,
        goalDate: goalForm.goalDate.value,
        goalNote: goalForm.goalNote.value.trim(),
        goalType: goalForm.goalType.value,
        goalPriority: goalForm.goalPriority.value,
        intensity: goalForm.intensity.value,
      };
      console.log('목표 설정:', data);
      alert('목표가 저장되었습니다!');
      closeGoalModal();
    });

    // 설정 모달 열기/닫기
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const settingsCloseBtn = document.getElementById('settingsCloseBtn');
    const settingsCancelBtn = document.getElementById('settingsCancelBtn');
    const settingsForm = document.getElementById('settingsForm');

    function openSettingsModal() {
      settingsModal.classList.add('active');
      settingsForm.reset();
      settingsForm.querySelector('select, input, textarea').focus();
    }

    function closeSettingsModal() {
      settingsModal.classList.remove('active');
    }

    settingsBtn.addEventListener('click', openSettingsModal);
    settingsCloseBtn.addEventListener('click', closeSettingsModal);
    settingsCancelBtn.addEventListener('click', closeSettingsModal);
    settingsModal.addEventListener('click', e => {
      if (e.target === settingsModal) closeSettingsModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && settingsModal.classList.contains('active')) closeSettingsModal();
    });
    settingsForm.addEventListener('submit', e => {
      e.preventDefault();
      if (!settingsForm.checkValidity()) {
        settingsForm.reportValidity();
        return;
      }
      const data = {
        notifications: settingsForm.notifications.value,
        location: settingsForm.location.value,
        soundOn: settingsForm.soundOn.checked,
        language: settingsForm.language.value,
        theme: settingsForm.theme.value,
        dataSync: settingsForm.dataSync.value,
        features: Array.from(settingsForm.features).filter(f => f.checked).map(f => f.value),
        customNote: settingsForm.customNote.value.trim(),
      };
      console.log('설정:', data);
      alert('설정이 저장되었습니다!');
      closeSettingsModal();
    });

    // 기존 버튼 이벤트
    const startBtn = document.getElementById('startBtn');
    startBtn.addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    const musicBtn = document.getElementById('musicBtn');
    let isMuted = false;
    musicBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      if (isMuted) {
        musicBtn.classList.add('muted');
      } else {
        musicBtn.classList.remove('muted');
      }
    });
  </script>
</body>
</html>
