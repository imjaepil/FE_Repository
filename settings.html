<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>설정</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0; padding: 0;
      background: #f7f8fa;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
      color: #1a232b;
      min-width: 360px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .container {
      max-width: 430px;
      min-width: 330px;
      margin: 0 auto;
      padding-bottom: 100px; /* 하단바 자리 확보 */
      background: #fff;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    header {
      position: sticky;
      top: 0;
      background: #fff;
      border-bottom: 1.5px solid #e5e7eb;
      padding: 18px 20px;
      font-size: 22px;
      font-weight: 700;
      z-index: 10;
      user-select: none;
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px 40px;
    }
    section.setting-group {
      border: 1.5px solid #e5e7eb;
      border-radius: 16px;
      margin-bottom: 24px;
      background: #fff;
      box-shadow: 0 3px 16px rgba(50,60,100,0.05);
      overflow: hidden;
    }
    section .group-header {
      padding: 18px 24px;
      font-weight: 700;
      font-size: 18px;
      background: #f0f2f7;
      cursor: pointer;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    section .group-header:hover {
      background: #e0e5f0;
    }
    section .group-header .arrow {
      border-style: solid;
      border-width: 0.2em 0.2em 0 0;
      content: '';
      display: inline-block;
      height: 0.45em;
      left: 0.15em;
      position: relative;
      top: 0.15em;
      transform-origin: center;
      width: 0.45em;
      transform: rotate(45deg);
      transition: transform 0.25s ease;
    }
    section.collapsed .group-header .arrow {
      transform: rotate(-135deg);
    }
    section .group-content {
      padding: 16px 24px 26px;
      animation: fadeInAccordion 0.3s ease forwards;
    }
    @keyframes fadeInAccordion {
      from { opacity: 0; max-height: 0; }
      to { opacity: 1; max-height: 2000px; }
    }
    .setting-item {
      margin-bottom: 16px;
    }
    .setting-label {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
      color: #2a2a2a;
    }
    .setting-desc {
      font-size: 13px;
      color: #727988;
      margin-bottom: 12px;
    }
    .input-text, select {
      width: 100%;
      font-size: 15px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.2px solid #ccc;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .input-text:focus, select:focus {
      outline: none;
      border-color: #1a232b;
    }
    .btn {
      padding: 11px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      border: none;
      background-color: #000;
      color: #fff;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #444;
    }
    .btn.outline {
      background-color: #fff;
      color: #222;
      border: 1.5px solid #444;
    }
    /* Toggle Switch */
    .toggle-switch {
      position: relative;
      width: 50px;
      height: 26px;
      display: inline-block;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      border-radius: 50px;
      transition: 0.4s;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      border-radius: 50%;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
    }
    input:checked + .slider {
      background-color: #000;
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }
    /* Notification checkboxes */
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .checkbox-group label {
      cursor: pointer;
      font-size: 14px;
      color: #444;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .checkbox-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    /* Multiple buttons */
    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    /* Privacy & Security */
    .info-text {
      font-size: 13px;
      color: #555;
      margin-bottom: 10px;
    }
    /* Scrollbar Custom */
    main::-webkit-scrollbar {
      width: 8px;
    }
    main::-webkit-scrollbar-thumb {
      background-color: #ccc;
      border-radius: 4px;
    }
    main::-webkit-scrollbar-track {
      background-color: transparent;
    }
    /* 하단 내비게이션 바 스타일 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      max-width: 430px;
      width: 100vw;
      background: #fff;
      border-top: 1.5px solid #e5e7eb;
      height: 53px;
      z-index: 99;
      display: flex;
    }
    .nav-item {
      flex: 1;
      text-align: center;
      font-size: 16px;
      padding-top: 6px;
      color: #000;
      letter-spacing: -1px;
      cursor: pointer;
      text-decoration: none;
      line-height: 53px;
      transition: background 0.2s, color 0.2s;
      box-sizing: border-box;
      user-select: none;
    }
    .nav-item.active {
      color: #000;
      font-weight: 700;
      background: #eef2f7;
    }
    @media (max-width: 400px) {
      .container {
        padding-bottom: 80px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>설정</header>
    <main>

      <!-- 계정 및 개인정보 관리 -->
      <section class="setting-group">
        <div class="group-header">계정 및 개인정보 관리 <span class="arrow"></span></div>
        <div class="group-content">
          <div class="setting-item">
            <label class="setting-label" for="profile-img">프로필 사진 변경</label>
            <input type="file" id="profile-img" accept="image/*" />
          </div>
          <div class="setting-item">
            <label class="setting-label" for="user-name">이름</label>
            <input type="text" id="user-name" class="input-text" placeholder="이름을 입력하세요" value="홍길동" />
          </div>
          <div class="setting-item">
            <label class="setting-label" for="user-email">이메일</label>
            <input type="email" id="user-email" class="input-text" placeholder="이메일을 입력하세요" value="hong@example.com" />
          </div>
          <div class="setting-item">
            <label class="setting-label" for="phone-number">전화번호</label>
            <input type="tel" id="phone-number" class="input-text" placeholder="전화번호를 입력하세요" value="010-1234-5678" />
          </div>
          <div class="setting-item">
            <label class="setting-label" for="password">비밀번호 변경</label>
            <input type="password" id="password" class="input-text" placeholder="새 비밀번호를 입력하세요" />
          </div>
          <div class="setting-item toggle-item">
            <label for="two-factor">2단계 인증 활성화</label>
            <label class="toggle-switch">
              <input type="checkbox" id="two-factor" />
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </section>

      <!-- 알림 설정 -->
      <section class="setting-group collapsed">
        <div class="group-header">알림 설정 <span class="arrow"></span></div>
        <div class="group-content" style="display:none;">
          <div class="setting-item toggle-item">
            <label for="push-notify">푸시 알림 받기</label>
            <label class="toggle-switch">
              <input type="checkbox" id="push-notify" checked />
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-item toggle-item">
            <label for="email-notify">이메일 알림 받기</label>
            <label class="toggle-switch">
              <input type="checkbox" id="email-notify" />
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-item">
            <div class="setting-label">알림 종류</div>
            <div class="checkbox-group">
              <label><input type="checkbox" checked /> 플로깅 시작 알림</label>
              <label><input type="checkbox" checked /> 친구 요청 알림</label>
              <label><input type="checkbox" /> 이벤트 알림</label>
              <label><input type="checkbox" /> 앱 업데이트 알림</label>
            </div>
          </div>
        </div>
      </section>

      <!-- 디스플레이 및 테마 -->
      <section class="setting-group collapsed">
        <div class="group-header">디스플레이 및 테마 <span class="arrow"></span></div>
        <div class="group-content" style="display:none;">
          <div class="setting-item toggle-item">
            <label for="dark-mode">다크 모드</label>
            <label class="toggle-switch">
              <input type="checkbox" id="dark-mode" />
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-item">
            <label class="setting-label" for="font-size">폰트 크기 조절</label>
            <select id="font-size" class="input-text">
              <option value="small">작게</option>
              <option value="normal" selected>보통</option>
              <option value="large">크게</option>
            </select>
          </div>
          <div class="setting-item">
            <label class="setting-label" for="language">언어 설정</label>
            <select id="language" class="input-text">
              <option value="ko" selected>한국어</option>
              <option value="en">English</option>
              <option value="jp">日本語</option>
              <option value="cn">中文</option>
            </select>
          </div>
        </div>
      </section>

      <!-- 개인정보 보호 및 보안 -->
      <section class="setting-group collapsed">
        <div class="group-header">개인정보 보호 및 보안 <span class="arrow"></span></div>
        <div class="group-content" style="display:none;">
          <div class="setting-item toggle-item">
            <label for="location-access">위치 정보 접근 허용</label>
            <label class="toggle-switch">
              <input type="checkbox" id="location-access" checked />
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-item toggle-item">
            <label for="data-share">데이터 공유 동의</label>
            <label class="toggle-switch">
              <input type="checkbox" id="data-share" />
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-item toggle-item">
            <label for="app-lock">앱 잠금 설정 (PIN/생체인증)</label>
            <label class="toggle-switch">
              <input type="checkbox" id="app-lock" />
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </section>

      <!-- 앱 정보 및 지원 -->
      <section class="setting-group collapsed">
        <div class="group-header">앱 정보 및 지원 <span class="arrow"></span></div>
        <div class="group-content" style="display:none;">
          <div class="setting-item">
            <div class="setting-label">버전 정보</div>
            1.0.0
          </div>
          <div class="setting-item">
            <a href="#" style="color:#1a232b; text-decoration: underline;">이용 약관</a>
          </div>
          <div class="setting-item">
            <a href="#" style="color:#1a232b; text-decoration: underline;">개인정보 처리방침</a>
          </div>
          <div class="setting-item">
            <button class="btn outline" onclick="alert('고객센터에 문의해 주세요!')">고객센터 문의</button>
          </div>
          <div class="setting-item">
            <button class="btn outline" onclick="alert('로그아웃 되었습니다.'); location.href='index.html'">로그아웃</button>
          </div>
          <div class="setting-item">
            <button class="btn outline" onclick="alert('회원 탈퇴가 완료되었습니다.'); location.href='index.html'">회원 탈퇴</button>
          </div>
        </div>
      </section>

      <!-- 고급 설정 -->
      <section class="setting-group collapsed">
        <div class="group-header">고급 설정 <span class="arrow"></span></div>
        <div class="group-content" style="display:none;">
          <div class="setting-item">
            <button class="btn outline" onclick="if(confirm('데이터 초기화 시 복구할 수 없습니다. 진행할까요?')) alert('초기화 완료')">데이터 초기화</button>
          </div>
          <div class="setting-item">
            <button class="btn outline" onclick="alert('디버그 정보: 버전 1.0.0, 장치 ID: ABC123')">디버그 정보 보기</button>
          </div>
          <div class="setting-item">
            <button class="btn outline" onclick="alert('베타 기능 참여가 활성화되었습니다.')">베타 기능 참여 신청</button>
          </div>
        </div>
      </section>

    </main>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">홈</a>
    <a href="stats.html" class="nav-item">통계</a>
    <a href="chat.html" class="nav-item">채팅</a>
    <a href="settings.html" class="nav-item active">설정</a>
  </nav>

  <script>
    // 아코디언 기능
    document.querySelectorAll('.group-header').forEach(header => {
      header.addEventListener('click', () => {
        const section = header.parentElement;
        const content = header.nextElementSibling;
        const collapsed = section.classList.toggle('collapsed');
        if (collapsed) {
          content.style.display = 'none';
          header.querySelector('.arrow').style.transform = 'rotate(-135deg)';
        } else {
          content.style.display = 'block';
          header.querySelector('.arrow').style.transform = 'rotate(45deg)';
        }
      });
    });
    // 초기 접힌 상태 설정
    document.querySelectorAll('.setting-group.collapsed').forEach(section => {
      section.querySelector('.group-content').style.display = 'none';
      section.querySelector('.group-header .arrow').style.transform = 'rotate(-135deg)';
    });
  </script>
</body>
</html>
