<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>지민이와 채팅</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      background: #f7f8fa;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
      color: #1a232b;
      min-width: 360px;
    }
    .container {
      max-width: 430px;
      min-width: 330px;
      margin: 0 auto;
      padding-bottom: 80px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 12px;
      border-bottom: 1px solid #ededed;
      background: #fff;
      height: 56px;
      box-sizing: border-box;
      gap: 12px;
    }
    .back-btn {
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 8px;
      transition: background-color 0.2s;
      flex-shrink: 0;
    }
    .back-btn:hover {
      background: #eee;
    }
    .back-btn svg {
      width: 20px;
      height: 20px;
      stroke: #222;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .photo-box img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }
    .photo-box {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .top-title {
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
      user-select: none;
      margin-left: 4px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #fff;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      display: inline-block;
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 15px;
      line-height: 1.3;
      word-wrap: break-word;
      white-space: pre-wrap;
      box-sizing: border-box;
      margin: 0;
    }
    .message.user {
      background: #000;
      color: #fff;
      margin-left: auto;
      border-bottom-right-radius: 3px;
    }
    .message.other {
      background: #eee;
      color: #222;
      margin-right: auto;
      border-bottom-left-radius: 3px;
    }
    .input-area {
      display: flex;
      padding: 10px 16px;
      background: #fff;
      border-top: 1px solid #ddd;
    }
    .input-area input {
      flex: 1;
      border: 1.5px solid #ccc;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-area input:focus {
      border-color: #000;
    }
    .input-area button {
      margin-left: 10px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 10px 18px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .input-area button:disabled {
      background: #999;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="back-btn" onclick="history.back()" title="뒤로가기">
        <svg viewBox="0 0 24 24" aria-hidden="true" >
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </div>
      <div class="photo-box" title="사진 공간">
        <img src="imgs/img1.png" alt="유저 사진" />
      </div>
      <div class="top-title">지민이</div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <form class="input-area" id="chatForm">
      <input type="text" id="messageInput" autocomplete="off" placeholder="메시지 입력..." />
      <button type="submit" id="sendBtn" disabled>전송</button>
    </form>
  </div>

  <script>
    const chatMessages = document.getElementById('chatMessages');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    const messages = [
      { sender: 'other', text: '저번에 줍줍한 쓰레기 사진 공유해요!' }
    ];

    function renderMessages() {
      chatMessages.innerHTML = '';
      messages.forEach(msg => {
        const div = document.createElement('div');
        div.className = 'message ' + (msg.sender === 'user' ? 'user' : 'other');
        div.textContent = msg.text;
        chatMessages.appendChild(div);
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    renderMessages();

    messageInput.addEventListener('input', () => {
      sendBtn.disabled = messageInput.value.trim() === '';
    });

    chatForm.addEventListener('submit', e => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (text) {
        messages.push({ sender: 'user', text });
        renderMessages();
        messageInput.value = '';
        sendBtn.disabled = true;
      }
    });
  </script>
</body>
</html>
