<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>플로깅 랭킹 보기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0; background: #f7f8fa;
      font-family: 'Pretendard','Apple SD Gothic Neo',sans-serif;
      color: #1a232b;
      min-width: 360px;
    }
    .container {
      max-width: 430px; min-width: 330px; margin: 0 auto;
      padding-bottom: 120px;
    }
    .header {
      padding: 32px 24px 16px 24px;
      font-weight: 700;
      font-size: 24px;
      color: #222;
      border-bottom: 2px solid #e3e7eb;
      margin-bottom: 20px;
      user-select: none;
    }
    .summary-stats {
      display: flex;
      justify-content: space-between;
      margin: 0 24px 24px 24px;
      background: #fff;
      padding: 14px 20px;
      border-radius: 18px;
      box-shadow: 0 3px 15px rgba(20,30,60,0.1);
      user-select: none;
    }
    .summary-item {
      flex: 1;
      text-align: center;
      border-right: 1px solid #e3e7eb;
      font-weight: 700;
      color: #1a232b;
      font-size: 18px;
      padding: 0 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .summary-item:last-child {
      border-right: none;
    }
    .summary-value {
      font-size: 20px;
      color: #000;
      margin-bottom: 4px;
    }
    .summary-label {
      font-weight: 400;
      color: #8f97a3;
      font-size: 13px;
    }
    .filter-section {
      margin: 0 24px 20px 24px;
      display: flex;
      justify-content: space-between;
      background: #fff;
      padding: 12px 18px;
      border-radius: 15px;
      box-shadow: 0 2px 10px rgba(20,30,60,0.06);
      user-select: none;
      align-items: center;
    }
    .filter-label {
      font-size: 16px;
      font-weight: 700;
      color: #333;
      line-height: 36px;
    }
    .filter-select {
      border-radius: 12px;
      border: 1.5px solid #ccc;
      font-size: 16px;
      padding: 6px 12px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.25s;
    }
    .filter-select:focus {
      border-color: #000;
    }
    .ranking-card {
      background: #fff; border-radius: 18px; box-shadow: 0 4px 18px rgba(20,30,60,0.1);
      margin: 7px 24px 20px 24px; padding: 12px 0;
      transition: box-shadow 0.3s;
      overflow-y: auto;
      max-height: 400px;
    }
    .ranking-card:hover {
      box-shadow: 0 6px 30px rgba(20,30,60,0.15);
    }
    .rank-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px; border-bottom: 1px solid #e3e7eb; font-size: 17px; min-height: 52px;
      transition: background 0.15s;
      cursor: default;
    }
    .rank-row:hover {
      background: #f0f4fb;
    }
    .rank-row:last-child { border-bottom: 0; }
    .rank-left {
      display: flex; align-items: center; gap: 14px;
      flex: 1;
    }
    .medal {
      width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800;
      font-size: 20px;
      user-select: none;
      flex-shrink: 0;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    .gold {
      background: linear-gradient(135deg, #f5b000, #ffdb6d);
      text-shadow: 0 0 5px #bf8e00;
    }
    .silver {
      background: linear-gradient(135deg, #bfc0c1, #ececec);
      color: #222;
      text-shadow: none;
    }
    .bronze {
      background: linear-gradient(135deg, #c89d67, #ecd09b);
      color: #222;
      text-shadow: none;
    }
    .gray-medal {
      background: #cbd2d9;
      color: #6d7280;
      font-weight: 700;
      font-size: 18px;
      user-select: none;
      box-shadow: none;
    }
    .city {
      font-weight: 700;
      font-size: 18px;
      color: #1a232b;
      min-width: 110px;
      user-select: text;
    }
    .dist {
      font-size: 14px;
      color: #8f97a3;
      margin-left: 8px;
      font-weight: 600;
      min-width: 80px;
      user-select: text;
    }
    .rank-id {
      font-weight: 700; color: #667;
      font-size: 17px;
      min-width: 54px;
      text-align: right;
      user-select: none;
      flex-shrink: 0;
    }
    .btns {
      display: grid;
      gap: 12px;
      margin: 26px 24px 0 24px;
    }
    .main-btn {
      font-size: 19px;
      border-radius: 15px;
      font-weight: 700;
      border: none;
      padding: 18px 0;
      cursor: pointer;
      background: #000;
      color: #fff;
      transition: background 0.3s;
      user-select: none;
    }
    .main-btn:hover {
      background: #444;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      max-width: none;
      width: 430px;
      background: #fff;
      border-top: 1.5px solid #e5e7eb;
      height: 53px;
      z-index: 99;
      display: flex;
    }
    .nav-item {
      flex: 1;
      text-align: center;
      font-size: 16px;
      padding-top: 6px;
      color: #000;
      letter-spacing: -1px;
      cursor: pointer;
      text-decoration: none;
      line-height: 53px;
      transition: background 0.2s, color 0.2s;
      box-sizing: border-box;
      user-select: none;
    }
    .nav-item.active {
      color: #000;
      font-weight: 700;
      background: #eef2f7;
    }
  </style>
</head>
<body>
  <div class="container" role="main" aria-label="플로깅 지역별 랭킹 보기 페이지">
    <div class="header">지역별 플로깅 랭킹</div>

    <div class="summary-stats" aria-label="전체 플로깅 통계 요약">
      <div class="summary-item">

        <div class="summary-label">참여 지역 수</div>
      </div>
      <div class="summary-item">
        <div class="summary-value" id="totalDistance">-- km</div>
        <div class="summary-label">누적 플로깅 거리</div>
      </div>
      <div class="summary-item">
        <div class="summary-value" id="totalTrash">-- kg</div>
        <div class="summary-label">수거한 쓰레기 양</div>
      </div>
    </div>

    <div class="filter-section" aria-label="랭킹 필터 선택">
      <label class="filter-label" for="regionFilter">지역별 필터:</label>

        <option value="경북">경북</option>
        <option value="경남">경남</option>
        <option value="제주">제주</option>
      </select>
    </div>

    <div class="ranking-card" id="rankingList" aria-live="polite" aria-relevant="additions" tabindex="0" role="list"></div>

    <div class="btns">
      <button class="main-btn" id="homeBtn" aria-label="홈페이지로 이동">홈으로 가기</button>
      <button class="main-btn" id="refreshBtn" aria-label="랭킹 데이터 갱신">랭킹 갱신</button>
    </div>
  </div>

function renderRanking(filterRegion) {
  const rankingList = document.getElementById('rankingList');

  if(filterRegion === '전체') {
    // 전체일 때는 rankingData에서 region === '전체'인 20개만 보여줌
    filtered = rankingData.filter(item => item.region === '전체');

  }
